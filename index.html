<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZSSK Cargo - posunovači Žilina</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; font-size: 12px; }
    th, td {
        border: 1px solid #ccc; padding: 0; text-align: center;
        vertical-align: middle; min-width: 30px; height: 28px;
    }
    th { background-color: #4a90d9; color: white; font-weight: bold; }
    th.weekend-header { background-color: #d9534f; }
    th.dnes-stlpec-hlavicka { background-color: #f0c419 !important; color: #000 !important; }
    td.dnes-stlpec { background-color: #fff3b0 !important; }
    .name-col {
        background-color: #f0f0f0; text-align: left; font-weight: normal;
        min-width: 140px; color: #666; padding: 0 6px;
    }
    th.name-col { background-color: #f0f0f0 !important; color: #666 !important; font-weight: normal !important; }
    .name-col-aktivny { background-color: #f0f0f0 !important; color: #1a3a6b !important; font-weight: bold !important; }
    .turnus-den { font-weight: bold; }

    /* ===== WRAPPER – správa sa ako tabuľka => šírka podľa obsahu ===== */
    .obsah-wrap {
        display: table;
        width: auto;
        max-width: 100%;
        box-sizing: border-box;
    }

    h2#mesiacNadpis {
        display: table-row;
        white-space: nowrap;
        margin: 0;
        padding: 0 0 12px 0;
        box-sizing: border-box;
    }

    /* ===== JEDNA NOČNÁ – colspan 2, O v strede (50 %) ===== */
    .turnus-O-single {
        background-color: #ffffff;
        color: #000;
        font-weight: bold;
        position: relative;
        text-align: center;
    }
    .turnus-O-single::before {
        content: "O";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-weight: bold;
        color: #000;
        pointer-events: none;
        line-height: 1;
        z-index: 2;
    }
    .turnus-O-single::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0;
        left: 50%;
        width: 1px;
        background-color: #ccc;
        transform: translateX(-50%);
        pointer-events: none;
        opacity: 1;
        z-index: 1;
    }

    /* ===== DVE NOČNÉ PO SEBE – colspan 3 ===== */
    .turnus-OO {
        background-color: #ffffff;
        color: #000;
        font-weight: bold;
        position: relative;
        text-align: center;
        background-image: linear-gradient(to right,
            transparent 0, transparent calc(33.333% - 0.5px),
            #ccc calc(33.333% - 0.5px), #ccc calc(33.333% + 0.5px),
            transparent calc(33.333% + 0.5px), transparent calc(66.666% - 0.5px),
            #ccc calc(66.666% - 0.5px), #ccc calc(66.666% + 0.5px),
            transparent calc(66.666% + 0.5px), transparent 100%);
        background-repeat: no-repeat;
        background-size: 100% 100%;
    }
    .turnus-OO::before {
        content: "O";
        position: absolute;
        top: 50%;
        left: 33.333%;
        transform: translate(-50%, -50%);
        font-weight: bold;
        color: #000;
        pointer-events: none;
        line-height: 1;
        z-index: 2;
    }
    .turnus-OO::after {
        content: "O";
        position: absolute;
        top: 50%;
        left: 66.666%;
        transform: translate(-50%, -50%);
        font-weight: bold;
        color: #000;
        pointer-events: none;
        line-height: 1;
        z-index: 2;
    }

    .turnus-C { background-color: #ffffff; color: #000; font-weight: bold; text-align: right; padding-right: 2px; }
    .turnus-C-rev {
        background-color: #ffffff;
        color: #000;
        font-weight: bold;
        text-align: left;
        padding-left: 0;
        padding-right: 0;
    }

    .nav-tlacidla {
        display: table-row;
        white-space: nowrap;
    }
    .nav-tlacidla > .nav-vnutor {
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
        box-sizing: border-box;
        width: 100%;
    }
    .nav-tlacidla button {
        background-color: #4a90d9; color: white; border: none; padding: 8px 16px;
        font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer;
        transition: background-color 0.2s;
        white-space: nowrap;
        flex-shrink: 0;
    }
    .nav-tlacidla button:hover { background-color: #357abd; }
    .nav-tlacidla button:active { background-color: #2a5f94; }
    .nav-tlacidla button:disabled { background-color: #a0a0a0; cursor: wait; }
    .nav-tlacidla .aktualny-mesiac {
        font-size: 14px; color: #333; font-weight: bold;
        white-space: nowrap;
        flex-shrink: 0;
    }
    .nav-tlacidla .loading-indikator {
        font-size: 12px; color: #4a90d9; font-weight: bold;
        white-space: nowrap;
        flex-shrink: 0;
        display: none;
    }
    .nav-tlacidla .loading-indikator.aktivny { display: inline-block; }

    .info-dnes {
        display: table-row;
        white-space: nowrap;
    }
    .info-dnes > .info-vnutor {
        background-color: #fff3b0;
        border-left: 4px solid #f0c419;
        padding: 10px 14px;
        margin-bottom: 15px;
        border-radius: 4px;
        font-size: 13px;
        color: #333;
        line-height: 1.5;
        white-space: nowrap;
        box-sizing: border-box;
        width: 100%;
    }
    .info-dnes .info-datum { font-size: 14px; font-weight: bold; color: #2a5f94; margin-bottom: 4px; }
    .info-dnes .info-mena { font-weight: bold; color: #1a3a6b; }
    .info-dnes .info-ziadne { font-style: italic; color: #999; }

    #tabulkaMesiaca {
        display: table;
        width: 100%;
    }

    .skryte { display: none !important; }
</style>
<body>

<div class="obsah-wrap">

    <h2 id="mesiacNadpis">Tabuľka mesiaca</h2>

    <div class="nav-tlacidla">
        <div class="nav-vnutor">
            <button id="btnPredchadzajuci">◄ Predchádzajúci</button>
            <span class="aktualny-mesiac" id="aktualnyMesiac"></span>
            <button id="btnNasledujuci">Nasledujúci ►</button>
            <span class="loading-indikator" id="loadingIndikator">⏳ načítavam…</span>
        </div>
    </div>

    <div id="infoDnes" class="info-dnes">
        <div class="info-vnutor"></div>
    </div>

    <table id="tabulkaMesiaca">
        <thead><tr id="hlavicka"></tr></thead>
        <tbody id="telo"></tbody>
    </table>

</div>

<script>
    // ===== KONFIGURÁCIA =====
    const API_URL = "https://script.google.com/macros/s/AKfycbzeWKQsJprVdzlwCukuIICMpvqEOENOQEvtMkw9C-Mr6kTB4z9B9GX0olDnEF2T_JEM0A/exec";

    const TURNUS = "IO---I/-";
    const DLZKA_CYKLU = TURNUS.length;
    const KOTVA_ROK = 2026;
    const KOTVA_MESIAC = 9;
    const KOTVA_DEN = 1;
    const KOTVA_INDEX = 6;
    const ZNAKY_DEN = ["I", "/", "D", "J"];
    const DNI_BEZ_SIKMOVEJ = [0, 5, 6];

    const POVOLENE_ZNAKY = ["I", "/", "O", "D", "J", "-", ""];
    const POVOLENE_ZNAKY_TEXT = "I, /, O, D, J, - (pomlčka) alebo prázdne na vymazanie.";

    // Timeout a retry pre JSONP
    const JSONP_TIMEOUT_MS = 20000;
    const JSONP_MAX_POKUSOV = 3;
    const POST_OVERENIE_MS = 3000;

    const clenovia = [
        { meno: "Ján Lukáč",        posun: 0 },
        { meno: "Viktor Imrišek",   posun: 1 },
        { meno: "Vladimír Vavrík",  posun: 2 },
        { meno: "Michal Choreň",    posun: 3 },
        { meno: "Lukáš Strýček",    posun: 4 },
        { meno: "Jakub Frimm",      posun: 5 },
        { meno: "Vladimír Staník",  posun: 6 },
        { meno: "Dávid Materlin",   posun: 7 }
    ];

    const nazvyMesiaca = [
        "január","február","marec","apríl","máj","jún",
        "júl","august","september","október","november","december"
    ];
    const skratkyDni = ["Ne","Po","Ut","St","Št","Pi","So"];

    const dnes = new Date();
    let zobrazenyRok = dnes.getFullYear();
    let zobrazenyMesiac = dnes.getMonth();

    let zmenyDatabaza = [];

    // ===== STAV NAČÍTAVANIA =====
    let nacitavaSa = false;
    let cakajuciRefresh = false;   // ak počas načítavania príde ďalšia požiadavka
    let pocitadloPoziadaviek = 0;  // aby staršie requesty neprepísali novšie

    // ===== POMOCNÉ =====
    function dniMedzi(rok1, mes1, den1, rok2, mes2, den2) {
        const d1 = Date.UTC(rok1, mes1, den1);
        const d2 = Date.UTC(rok2, mes2, den2);
        return Math.round((d2 - d1) / 86400000);
    }

    function datumString(rok, mesiac, den) {
        return rok + "-" + String(mesiac + 1).padStart(2, "0") + "-" + String(den).padStart(2, "0");
    }

    function normalizujDatum(hodnota) {
        if (hodnota == null || hodnota === "") return "";
        const s = String(hodnota).trim();
        let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return `${m[1]}-${m[2]}-${m[3]}`;
        m = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
        const datum = new Date(s);
        if (!isNaN(datum.getTime())) {
            return [datum.getFullYear(),
                String(datum.getMonth() + 1).padStart(2, "0"),
                String(datum.getDate()).padStart(2, "0")].join("-");
        }
        console.warn("Nepodarilo sa normalizovať dátum:", s);
        return s;
    }

    function najdiManualnuZmenu(meno, rok, mesiac, den) {
        const datumStr = datumString(rok, mesiac, den);
        return [...zmenyDatabaza].reverse().find(
            z => z.datum === datumStr && z.meno === meno
        );
    }

    function znakPreDen(clen, rok, mesiac, den) {
        const delta = dniMedzi(KOTVA_ROK, KOTVA_MESIAC, KOTVA_DEN, rok, mesiac, den);
        let idx = (KOTVA_INDEX - clen.posun + delta) % DLZKA_CYKLU;
        idx = ((idx % DLZKA_CYKLU) + DLZKA_CYKLU) % DLZKA_CYKLU;
        return TURNUS[idx];
    }

    function efektivnyZnak(clen, rok, mesiac, den) {
        const zmena = najdiManualnuZmenu(clen.meno, rok, mesiac, den);
        if (zmena) return zmena.novyZnak;
        return znakPreDen(clen, rok, mesiac, den);
    }

    function jeManualneVypnuty(clen, rok, mesiac, den) {
        const zmena = najdiManualnuZmenu(clen.meno, rok, mesiac, den);
        return !!(zmena && (zmena.novyZnak === "-" || zmena.novyZnak === ""));
    }

    function jeDnes(rok, mesiac, den) {
        return rok === dnes.getFullYear()
            && mesiac === dnes.getMonth()
            && den === dnes.getDate();
    }

    function jeAktualnyMesiac() {
        return zobrazenyRok === dnes.getFullYear() && zobrazenyMesiac === dnes.getMonth();
    }

    function aktualizujTlacidloPredchadzajuci() {
        const btn = document.getElementById("btnPredchadzajuci");
        if (jeAktualnyMesiac()) {
            btn.classList.add("skryte");
        } else {
            btn.classList.remove("skryte");
        }
    }

    function jeDenAktivny(clen, rok, mesiac, den) {
        const znak = efektivnyZnak(clen, rok, mesiac, den);
        if (znak === "I") return true;
        if (znak === "/") {
            const denTyzna = new Date(rok, mesiac, den).getDay();
            return !DNI_BEZ_SIKMOVEJ.includes(denTyzna);
        }
        return false;
    }

    function nastavDnesZvyraznenie(td, startDen, endDen) {
        if (!(dnes.getFullYear() === zobrazenyRok && dnes.getMonth() === zobrazenyMesiac)) return;
        const dnesDen = dnes.getDate();
        if (dnesDen < startDen || dnesDen > endDen) return;

        const pocet = endDen - startDen + 1;
        const indexDna = dnesDen - startDen;
        const zaciatok = (indexDna / pocet) * 100;
        const koniec = ((indexDna + 1) / pocet) * 100;

        if (pocet === 1) {
            td.style.backgroundImage = "none";
            td.style.backgroundColor = "#fff3b0";
            return;
        }

        td.style.backgroundImage =
            "linear-gradient(to right, " +
            "#ffffff 0%, #ffffff " + zaciatok + "%, " +
            "#fff3b0 " + zaciatok + "%, #fff3b0 " + koniec + "%, " +
            "#ffffff " + koniec + "%, #ffffff 100%)";
        td.style.backgroundColor = "transparent";
    }

    function zobrazLoading(ano) {
        const el = document.getElementById("loadingIndikator");
        if (!el) return;
        if (ano) el.classList.add("aktivny");
        else el.classList.remove("aktivny");
        // Vypni/zapni tlačidlá počas načítavania
        document.getElementById("btnPredchadzajuci").disabled = ano;
        document.getElementById("btnNasledujuci").disabled = ano;
    }

    // ===== NAČÍTANIE Z GOOGLE SHEETS (JSONP s retry) =====
    function nacitajZmenyZoSheets(pokus = 1) {
        return new Promise((resolve) => {
            const callbackName = "jsonpCb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
            const script = document.createElement("script");
            let hotovo = false;

            const dokonci = (uspech) => {
                if (hotovo) return;
                hotovo = true;
                clearTimeout(timeout);
                try { delete window[callbackName]; } catch (e) {}
                try { script.remove(); } catch (e) {}

                if (uspech) {
                    resolve();
                    return;
                }
                // Neúspech – skús znova, ak ešte máme pokusy
                if (pokus < JSONP_MAX_POKUSOV) {
                    console.warn(`JSONP pokus ${pokus} zlyhal, skúšam znova...`);
                    // Malý backoff
                    setTimeout(() => {
                        nacitajZmenyZoSheets(pokus + 1).then(resolve);
                    }, 500 * pokus);
                } else {
                    console.warn("JSONP: maximálny počet pokusov vyčerpaný.");
                    resolve();
                }
            };

            const timeout = setTimeout(() => {
                console.warn(`JSONP timeout po ${JSONP_TIMEOUT_MS}ms (pokus ${pokus}).`);
                dokonci(false);
            }, JSONP_TIMEOUT_MS);

            window[callbackName] = function(data) {
                console.log("Surové dáta z JSONP:", data);
                try {
                    if (data && !Array.isArray(data) && data.result === "error") {
                        console.error("Server error:", data.message);
                        zmenyDatabaza = [];
                    } else if (Array.isArray(data)) {
                        zmenyDatabaza = data.map(z => {
                            let datum, meno, den, novyZnak;
                            if (Array.isArray(z)) {
                                datum = z[0]; meno = z[1]; den = z[2]; novyZnak = z[3];
                            } else {
                                datum = z.datum; meno = z.meno; den = z.den; novyZnak = z.novyZnak;
                            }
                            return {
                                datum: normalizujDatum(datum),
                                meno: String(meno || "").trim(),
                                den: den,
                                novyZnak: (novyZnak == null ? "" : String(novyZnak))
                            };
                        });
                        console.log("Načítaných zmien:", zmenyDatabaza.length, zmenyDatabaza);
                    } else {
                        console.warn("Neočakávaný formát:", data);
                        zmenyDatabaza = [];
                    }
                } catch (e) {
                    console.error("Chyba spracovania JSONP:", e);
                    zmenyDatabaza = [];
                }
                dokonci(true);
            };

            script.onerror = function() {
                console.error("JSONP načítanie zlyhalo (onerror).");
                dokonci(false);
            };

            // Anti-cache: unikátny callback + timestamp + random
            script.src = API_URL
                + "?callback=" + callbackName
                + "&_=" + Date.now()
                + "&r=" + Math.random().toString(36).slice(2);
            document.body.appendChild(script);
        });
    }

    function ulozZmenuDoSheets(datum, meno, den, novyZnak) {
        const form = document.createElement("form");
        form.method = "POST";
        form.action = API_URL;
        form.target = "skrytyIframe";
        form.style.display = "none";
        const polia = { datum, meno, den, novyZnak };
        for (const key in polia) {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = key;
            input.value = polia[key];
            form.appendChild(input);
        }
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);
        console.log("POST odoslaný:", polia);

        // Po chvíli over, či Google Script zápis naozaj zapísal.
        // Ak áno, tabuľka sa obnoví s čerstvými dátami.
        setTimeout(() => {
            obnovAVykresli(true);
        }, POST_OVERENIE_MS);
    }

    function aktualizujInfoDnes() {
        const vnutro = document.querySelector("#infoDnes > .info-vnutor");
        const den = dnes.getDate();
        const mesiac = dnes.getMonth();
        const rok = dnes.getFullYear();
        const denTyzna = dnes.getDay();
        const datumText = den + ". " + nazvyMesiaca[mesiac] + " " + rok
            + " (" + skratkyDni[denTyzna] + ")";

        const aktivni = clenovia.filter(clen => jeDenAktivny(clen, rok, mesiac, den));

        let menaHtml = aktivni.length > 0
            ? aktivni.map(c => c.meno).join(", ")
            : '<span class="info-ziadne">žiadne</span>';

        vnutro.innerHTML =
            '<div class="info-datum">Dnes: ' + datumText + '</div>' +
            '<div><span class="info-mena">' + menaHtml + '</span></div>';
    }

    function vykresliTabulku() {
        console.log("Vykresľujem tabuľku, zmien v DB:", zmenyDatabaza.length);

        aktualizujTlacidloPredchadzajuci();

        const pocetDni = new Date(zobrazenyRok, zobrazenyMesiac + 1, 0).getDate();

        // ===== NOVÉ: ak je aktuálny mesiac, skryjeme dni pred dneškom =====
        const jeAktualny = jeAktualnyMesiac();
        const startDen = jeAktualny ? dnes.getDate() : 1;

        document.getElementById("mesiacNadpis").textContent =
            "Tabuľka mesiaca – " + nazvyMesiaca[zobrazenyMesiac] + " " + zobrazenyRok;
        document.getElementById("aktualnyMesiac").textContent =
            nazvyMesiaca[zobrazenyMesiac].charAt(0).toUpperCase() +
            nazvyMesiaca[zobrazenyMesiac].slice(1) + " " + zobrazenyRok;

        const hlavicka = document.getElementById("hlavicka");
        hlavicka.innerHTML = "";
        const thMeno = document.createElement("th");
        thMeno.className = "name-col";
        thMeno.textContent = "Meno a priezvisko";
        hlavicka.appendChild(thMeno);

        // Hlavička len od startDen po pocetDni
        for (let d = startDen; d <= pocetDni; d++) {
            const datum = new Date(zobrazenyRok, zobrazenyMesiac, d);
            const denTyzna = datum.getDay();
            const th = document.createElement("th");
            if (denTyzna === 0 || denTyzna === 6) th.classList.add("weekend-header");
            if (jeDnes(zobrazenyRok, zobrazenyMesiac, d)) th.classList.add("dnes-stlpec-hlavicka");
            th.innerHTML = d + "<br>" + skratkyDni[denTyzna];
            hlavicka.appendChild(th);
        }

        const telo = document.getElementById("telo");
        telo.innerHTML = "";

        const dnesVZobrazenom =
            dnes.getFullYear() === zobrazenyRok && dnes.getMonth() === zobrazenyMesiac;
        const dnesDen = dnes.getDate();

        clenovia.forEach(clen => {
            const tr = document.createElement("tr");

            const tdMeno = document.createElement("td");
            tdMeno.className = "name-col";
            tdMeno.textContent = clen.meno;

            if (dnesVZobrazenom) {
                if (jeDenAktivny(clen, zobrazenyRok, zobrazenyMesiac, dnesDen)) {
                    tdMeno.classList.add("name-col-aktivny");
                }
            }
            tr.appendChild(tdMeno);

            // "C" (noc pokračuje z minulého mesiaca) má zmysel len ak zobrazujeme od 1. dňa
            // (t. j. nie aktuálny mesiac skrátený). V skrátenom režime ho preskočíme.
            if (startDen === 1) {
                const predchDatum = new Date(zobrazenyRok, zobrazenyMesiac, 0);
                const presahZMinuleho = efektivnyZnak(
                    clen, predchDatum.getFullYear(), predchDatum.getMonth(), predchDatum.getDate()
                ) === "O";

                if (presahZMinuleho) {
                    const td = document.createElement("td");
                    td.textContent = "Ↄ";
                    td.classList.add("turnus-C-rev");
                    td.title = "Noc pokračuje z minulého mesiaca";
                    if (jeDnes(zobrazenyRok, zobrazenyMesiac, 1)) td.classList.add("dnes-stlpec");
                    pridelKlikHandler(td, clen, 1, "Ↄ");
                    tr.appendChild(td);
                }
            }

            let d = startDen;
            while (d <= pocetDni) {
                const znak = efektivnyZnak(clen, zobrazenyRok, zobrazenyMesiac, d);
                const datum = new Date(zobrazenyRok, zobrazenyMesiac, d);
                const denTyzna = datum.getDay();
                const td = document.createElement("td");

                // "C" (noc začína na konci mesiaca) – zachováme len ak nie sme v skrátenom režime,
                // alebo ak je to posledný deň mesiaca (vždy sa zobrazí).
                if (d === pocetDni && znak === "O") {
                    td.textContent = "C";
                    td.classList.add("turnus-C");
                    td.title = "Noc začína na konci mesiaca";
                    if (jeDnes(zobrazenyRok, zobrazenyMesiac, d)) td.classList.add("dnes-stlpec");
                    pridelKlikHandler(td, clen, d, "C");
                    tr.appendChild(td);
                    d += 1;
                    continue;
                }

                if (znak === "O") {
                    const dalsiDen = d + 1;
                    const dalsiZnak = (dalsiDen <= pocetDni)
                        ? efektivnyZnak(clen, zobrazenyRok, zobrazenyMesiac, dalsiDen)
                        : null;

                    // Dve nočné po sebe – len ak sú obe dni v zobrazovanom rozsahu
                    if (dalsiZnak === "O" && d + 2 <= pocetDni) {
                        td.colSpan = 3;
                        td.classList.add("turnus-OO");
                        td.textContent = "";
                        td.title = "Dve nočné po sebe (deň " + d + " → deň " + (d + 2) + ")";
                        nastavDnesZvyraznenie(td, d, d + 2);
                        pridelKlikHandlerPreOO(td, clen, d, d + 1, d + 2);
                        tr.appendChild(td);
                        d += 3;
                        continue;
                    }

                    td.colSpan = 2;
                    td.classList.add("turnus-O-single");
                    td.textContent = "";
                    td.title = "Noc (deň " + d + " → deň " + dalsiDen + ")";
                    nastavDnesZvyraznenie(td, d, dalsiDen);
                    pridelKlikHandlerPreSingle(td, clen, d, d + 1);
                    tr.appendChild(td);
                    d += 2;
                    continue;
                }

                if (znak === "-" || znak === "" || znak == null) {
                    td.textContent = "";
                    if (jeDnes(zobrazenyRok, zobrazenyMesiac, d)) td.classList.add("dnes-stlpec");
                    pridelKlikHandler(td, clen, d, znak || "");
                    tr.appendChild(td);
                    d += 1;
                    continue;
                }

                if (znak === "/" && DNI_BEZ_SIKMOVEJ.includes(denTyzna)) {
                    td.textContent = "";
                    if (jeDnes(zobrazenyRok, zobrazenyMesiac, d)) td.classList.add("dnes-stlpec");
                    pridelKlikHandler(td, clen, d, "");
                    tr.appendChild(td);
                    d += 1;
                    continue;
                }

                td.textContent = znak;
                if (ZNAKY_DEN.includes(znak)) td.classList.add("turnus-den");
                if (jeDnes(zobrazenyRok, zobrazenyMesiac, d)) td.classList.add("dnes-stlpec");
                pridelKlikHandler(td, clen, d, znak);
                tr.appendChild(td);
                d += 1;
            }
            telo.appendChild(tr);
        });

        aktualizujInfoDnes();
    }

    // ===== POMOCNÁ FUNKCIA: zapíš zmenu do DB + POST + refresh =====
    function zapisZmenu(clen, den, znak) {
        const datumStr = datumString(zobrazenyRok, zobrazenyMesiac, den);

        // Okamžitá lokálna aktualizácia (aby UI reagovalo hneď)
        zmenyDatabaza = zmenyDatabaza.filter(
            z => !(z.datum === datumStr && z.meno === clen.meno)
        );
        zmenyDatabaza.push({
            datum: datumStr, meno: clen.meno, den: den, novyZnak: znak
        });

        // Pošli na server (POST) – po 3s sa overí a obnoví z reálnych dát
        ulozZmenuDoSheets(datumStr, clen.meno, den, znak);

        // Okamžité prekreslenie s lokálnou zmenou
        vykresliTabulku();
    }

    function pridelKlikHandler(td, clen, den, aktualnyZnak) {
        td.style.cursor = "pointer";
        td.title = (td.title ? td.title + " | " : "") +
            "Klikni pre zmenu. Aktuálne: '" + (aktualnyZnak || "prázdne") + "'";

        td.addEventListener("click", () => {
            const novy = prompt(
                "Zadaj nový znak pre " + clen.meno + " dňa " + den + ".\n" +
                "Možnosti: " + POVOLENE_ZNAKY_TEXT + "\n" +
                "Aktuálne: '" + (aktualnyZnak || "prázdne") + "'",
                aktualnyZnak
            );
            if (novy === null) return;
            const znak = novy.trim();
            if (!POVOLENE_ZNAKY.includes(znak)) {
                alert("Neplatný znak. Povolené: " + POVOLENE_ZNAKY_TEXT);
                return;
            }
            zapisZmenu(clen, den, znak);
        });
    }

    function pridelKlikHandlerPreSingle(td, clen, den1, den2) {
        td.style.cursor = "pointer";
        td.title = (td.title ? td.title + " | " : "") +
            "Klikni: ľavá časť = deň " + den1 + " (začiatok noci), pravá časť = deň " + den2 + " (koniec noci).";

        td.addEventListener("click", (event) => {
            const rect = td.getBoundingClientRect();
            const relativnaX = (event.clientX - rect.left) / rect.width;
            const den = (relativnaX < 0.5) ? den1 : den2;

            const aktualnyZnak = efektivnyZnak(clen, zobrazenyRok, zobrazenyMesiac, den);

            const novy = prompt(
                "Zadaj nový znak pre " + clen.meno + " dňa " + den + ".\n" +
                "Možnosti: " + POVOLENE_ZNAKY_TEXT + "\n" +
                "Aktuálne: '" + (aktualnyZnak || "prázdne") + "'",
                aktualnyZnak
            );
            if (novy === null) return;
            const znak = novy.trim();
            if (!POVOLENE_ZNAKY.includes(znak)) {
                alert("Neplatný znak. Povolené: " + POVOLENE_ZNAKY_TEXT);
                return;
            }
            zapisZmenu(clen, den, znak);
        });
    }

    function pridelKlikHandlerPreOO(td, clen, den1, den2, den3) {
        td.style.cursor = "pointer";
        td.title = (td.title ? td.title + " | " : "") +
            "Klikni: ľavá časť = deň " + den1 + ", stred = deň " + den2 + ", pravá časť = deň " + den3 + ".";

        td.addEventListener("click", (event) => {
            const rect = td.getBoundingClientRect();
            const relativnaX = (event.clientX - rect.left) / rect.width;
            let den;
            if (relativnaX < 1 / 3) den = den1;
            else if (relativnaX < 2 / 3) den = den2;
            else den = den3;

            const aktualnyZnak = efektivnyZnak(clen, zobrazenyRok, zobrazenyMesiac, den);

            const novy = prompt(
                "Zadaj nový znak pre " + clen.meno + " dňa " + den + ".\n" +
                "Možnosti: " + POVOLENE_ZNAKY_TEXT + "\n" +
                "Aktuálne: '" + (aktualnyZnak || "prázdne") + "'",
                aktualnyZnak
            );
            if (novy === null) return;
            const znak = novy.trim();
            if (!POVOLENE_ZNAKY.includes(znak)) {
                alert("Neplatný znak. Povolené: " + POVOLENE_ZNAKY_TEXT);
                return;
            }
            zapisZmenu(clen, den, znak);
        });
    }

    // ===== HLAVNÝ REFRESH: načítaj z Google Sheet a prekresli =====
    function obnovAVykresli(silent = false) {
        // Ak už prebieha načítavanie, označ, že po ňom treba ešte raz obnoviť
        if (nacitavaSa) {
            cakajuciRefresh = true;
            return Promise.resolve();
        }
        nacitavaSa = true;
        cakajuciRefresh = false;
        if (!silent) zobrazLoading(true);

        const mojeCislo = ++pocitadloPoziadaviek;

        return nacitajZmenyZoSheets()
            .then(() => {
                // Ak medzitým prišla novšia požiadavka, túto ignoruj
                if (mojeCislo !== pocitadloPoziadaviek) return;
                vykresliTabulku();
            })
            .finally(() => {
                nacitavaSa = false;
                if (!silent) zobrazLoading(false);

                // Ak počas načítavania prišla ďalšia požiadavka, spusti ju teraz
                if (cakajuciRefresh) {
                    cakajuciRefresh = false;
                    obnovAVykresli(silent);
                }
            });
    }

    // ===== NAVIGAČNÉ TLAČIDLÁ =====
    document.getElementById("btnPredchadzajuci").addEventListener("click", () => {
        zobrazenyMesiac--;
        if (zobrazenyMesiac < 0) { zobrazenyMesiac = 11; zobrazenyRok--; }
        obnovAVykresli();
    });
    document.getElementById("btnNasledujuci").addEventListener("click", () => {
        zobrazenyMesiac++;
        if (zobrazenyMesiac > 11) { zobrazenyMesiac = 0; zobrazenyRok++; }
        obnovAVykresli();
    });

    // ===== ŠTART =====
    document.addEventListener("DOMContentLoaded", () => {
        obnovAVykresli();
    });
</script>
