<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZSSK Cargo - depo Žilina</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; font-size: 12px; }
    th, td {
        border: 1px solid #ccc; padding: 0; text-align: center;
        vertical-align: middle; min-width: 30px; height: 28px;
    }
    th { background-color: #4a90d9; color: white; font-weight: bold; }
    th.weekend-header { background-color: #d9534f; }
    th.dnes-stlpec-hlavicka { background-color: #f0c419 !important; color: #000 !important; }
    td.dnes-stlpec { background-color: #fff3b0 !important; }
    .name-col {
        background-color: #f0f0f0; text-align: left; font-weight: normal;
        min-width: 140px; color: #666; padding: 0 6px;
    }
    th.name-col { background-color: #f0f0f0 !important; color: #666 !important; font-weight: normal !important; }
    .name-col-aktivny { background-color: #f0f0f0 !important; color: #1a3a6b !important; font-weight: bold !important; }
    .turnus-den { font-weight: bold; }

    td sub { font-size: 0.7em; }

    .obsah-wrap { display: table; width: auto; max-width: 100%; box-sizing: border-box; }
    h2#mesiacNadpis { display: table-row; white-space: nowrap; margin: 0; padding: 0 0 12px 0; box-sizing: border-box; }

    .turnus-O-single { background-color: #ffffff; color: #000; font-weight: bold; position: relative; text-align: center; }
    .turnus-O-single::before {
        content: "O"; position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%); font-weight: bold; color: #000;
        pointer-events: none; line-height: 1; z-index: 2;
    }
    .turnus-O-single::after {
        content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
        width: 1px; background-color: #ccc; transform: translateX(-50%);
        pointer-events: none; opacity: 1; z-index: 1;
    }
    .turnus-OO {
        background-color: #ffffff; color: #000; font-weight: bold;
        position: relative; text-align: center;
        background-image: linear-gradient(to right,
            transparent 0, transparent calc(33.333% - 0.5px),
            #ccc calc(33.333% - 0.5px), #ccc calc(33.333% + 0.5px),
            transparent calc(33.333% + 0.5px), transparent calc(66.666% - 0.5px),
            #ccc calc(66.666% - 0.5px), #ccc calc(66.666% + 0.5px),
            transparent calc(66.666% + 0.5px), transparent 100%);
        background-repeat: no-repeat; background-size: 100% 100%;
    }
    .turnus-OO::before {
        content: "O"; position: absolute; top: 50%; left: 33.333%;
        transform: translate(-50%, -50%); font-weight: bold; color: #000;
        pointer-events: none; line-height: 1; z-index: 2;
    }
    .turnus-OO::after {
        content: "O"; position: absolute; top: 50%; left: 66.666%;
        transform: translate(-50%, -50%); font-weight: bold; color: #000;
        pointer-events: none; line-height: 1; z-index: 2;
    }
    .turnus-C { background-color: #ffffff; color: #000; font-weight: bold; text-align: right; padding-right: 2px; }
    .turnus-C-rev {
        background-color: #ffffff; color: #000; font-weight: bold;
        text-align: left; padding-left: 0; padding-right: 0;
    }

    .nav-tlacidla { display: table-row; white-space: nowrap; }
    .nav-tlacidla > .nav-vnutor {
        display: flex; align-items: center; gap: 12px;
        white-space: nowrap; box-sizing: border-box; width: 100%;
        padding-bottom: 24px;
    }
    .nav-tlacidla button {
        background-color: #4a90d9; color: white; border: none; padding: 8px 16px;
        font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer;
        transition: background-color 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .nav-tlacidla button:hover { background-color: #357abd; }
    .nav-tlacidla button:active { background-color: #2a5f94; }
    .nav-tlacidla button:disabled { background-color: #a0a0a0; cursor: wait; }
    .nav-tlacidla .aktualny-mesiac {
        font-size: 14px; color: #333; font-weight: bold;
        white-space: nowrap; flex-shrink: 0;
    }

    .info-dnes { display: table-row; white-space: nowrap; }
    .info-dnes > .info-vnutor {
        background-color: #fff3b0; border-left: 4px solid #f0c419;
        padding: 10px 14px; margin-bottom: 15px; border-radius: 4px;
        font-size: 13px; color: #333; line-height: 1.5;
        white-space: nowrap; box-sizing: border-box; width: 100%;
    }
    .info-dnes .info-datum { font-size: 14px; font-weight: bold; color: #2a5f94; margin-bottom: 4px; }
    .info-dnes .info-mena { font-weight: bold; color: #1a3a6b; }
    .info-dnes .info-ziadne { font-style: italic; color: #999; }

    #tabulkaMesiaca { display: table; width: 100%; }

    .skryte { display: none !important; }

    /* ===== MODÁLNE OKNO ===== */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
        display: flex; align-items: center; justify-content: center;
        z-index: 1000; animation: fadeIn 0.15s ease-out;
    }
    .modal-overlay.skryte { display: none !important; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
        background: #fff; border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        padding: 20px 22px 18px 22px;
        min-width: 320px; max-width: 90vw;
        animation: slideUp 0.18s ease-out;
    }
    @keyframes slideUp {
        from { transform: translateY(15px); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-title { font-size: 15px; font-weight: bold; color: #1a3a6b; margin: 0 0 4px 0; }
    .modal-subtitle { font-size: 12px; color: #666; margin: 0 0 16px 0; }
    .modal-subtitle strong { color: #333; }

    .modal-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .modal-options button {
        padding: 14px 0; font-size: 20px; font-weight: bold;
        border: 2px solid #4a90d9; background: #f4f8ff; color: #1a3a6b;
        border-radius: 8px; cursor: pointer; transition: all 0.15s; line-height: 1;
    }
    .modal-options button:hover {
        background: #4a90d9; color: #fff;
        transform: translateY(-1px); box-shadow: 0 4px 10px rgba(74,144,217,0.35);
    }
    .modal-options button:active { transform: translateY(0); }
    .modal-options button.aktualny {
        border-color: #f0c419; background: #fff8d9;
        box-shadow: 0 0 0 2px #f0c419 inset;
    }
    .modal-options button.aktualny:hover { background: #f0c419; color: #000; }

    .modal-options .btn-zmazat {
        grid-column: 1 / -1; font-size: 14px; padding: 11px 0;
        border-color: #d9534f; background: #fdf3f3; color: #a94442; margin-top: 4px;
    }
    .modal-options .btn-zmazat:hover {
        background: #d9534f; color: #fff; box-shadow: 0 4px 10px rgba(217,83,79,0.35);
    }
    .modal-options .btn-zmazat.aktualny {
        border-color: #f0c419; background: #fff8d9; color: #a94442;
        box-shadow: 0 0 0 2px #f0c419 inset;
    }

    .modal-footer { margin-top: 14px; text-align: right; }
    .modal-footer .btn-zrusit {
        background: transparent; border: none; color: #666;
        font-size: 13px; cursor: pointer; padding: 6px 10px; border-radius: 6px;
    }
    .modal-footer .btn-zrusit:hover { background: #f0f0f0; color: #333; }

    /* ===== MODÁLNE OKNO – PRIDANIE ČLENA ===== */
    .modal-forma { display: flex; flex-direction: column; gap: 12px; }
    .modal-forma label {
        font-size: 12px; font-weight: bold; color: #333;
        display: flex; flex-direction: column; gap: 4px;
    }
    .modal-forma input {
        padding: 10px 12px; font-size: 14px;
        border: 2px solid #cfe0f5; border-radius: 8px;
        outline: none; transition: border-color 0.15s; font-family: inherit;
    }
    .modal-forma input:focus { border-color: #4a90d9; }
    .modal-forma .btn-ulozit {
        margin-top: 8px; padding: 12px 0;
        font-size: 15px; font-weight: bold;
        border: none; border-radius: 8px;
        background: #2e9e4f; color: #fff;
        cursor: pointer; transition: background-color 0.15s;
    }
    .modal-forma .btn-ulozit:hover { background: #25823f; }
    .modal-forma .btn-ulozit:disabled { background: #a0a0a0; cursor: wait; }
    .modal-forma .chyba-msg {
        color: #a94442; font-size: 12px; font-weight: bold;
        min-height: 16px; margin-top: -4px;
    }

    /* ===== ZELENÉ OKRÚHLE TLAČIDLO + ===== */
    .btn-pridat-wrap { display: table-row; }
    .btn-pridat-wrap > .btn-pridat-vnutor { padding: 18px 0 6px 0; text-align: left; }
    .btn-pridat {
        width: 48px; height: 48px; border-radius: 50%;
        background: #2e9e4f; color: #fff; border: none;
        font-size: 28px; font-weight: bold; line-height: 1;
        cursor: pointer; box-shadow: 0 4px 12px rgba(46,158,79,0.4);
        transition: all 0.15s;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0;
    }
    .btn-pridat:hover {
        background: #25823f; transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(46,158,79,0.5);
    }
    .btn-pridat:active { transform: translateY(0); }

    /* ===== DRUHÁ TABUĽKA (noví členovia) ===== */
    .druha-tabulka-nadpis { display: table-row; white-space: nowrap; }
    .druha-tabulka-nadpis > div {
        margin: 30px 0 12px 0;
        font-size: 16px; font-weight: bold; color: #1a3a6b;
        border-top: 2px solid #e0e0e0; padding-top: 20px;
    }
    #tabulkaNova { display: table; width: 100%; margin-top: 30px; }
    .novy-riadok-meno { font-style: italic; color: #555; }

    /* ===== CELOOBRAZOVKA NAČÍTAVANIA ===== */
    .loading-overlay {
        position: fixed; inset: 0; background: #ffffff;
        display: flex; align-items: center; justify-content: center;
        z-index: 2000; animation: fadeIn 0.2s ease-out;
    }
    .loading-overlay.skryte { display: none !important; }
    .loading-overlay .loading-text {
        font-size: 18px; font-weight: bold; color: #4a90d9;
        display: flex; align-items: center; gap: 12px;
    }
    .loading-overlay .loading-text::before {
        content: ""; width: 22px; height: 22px;
        border: 3px solid #cfe0f5; border-top-color: #4a90d9;
        border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MODÁLNE OKNO – OSOBNÉ ČÍSLO ===== */
    .modal-osobne { display: flex; flex-direction: column; gap: 12px; }
    .modal-osobne label {
        font-size: 12px; font-weight: bold; color: #333;
        display: flex; flex-direction: column; gap: 4px;
    }
    .modal-osobne input {
        padding: 10px 12px; font-size: 16px;
        border: 2px solid #cfe0f5; border-radius: 8px;
        outline: none; transition: border-color 0.15s; font-family: inherit;
    }
    .modal-osobne input:focus { border-color: #4a90d9; }
    .modal-osobne .btn-pokracovat {
        margin-top: 8px; padding: 12px 0;
        font-size: 15px; font-weight: bold;
        border: none; border-radius: 8px;
        background: #4a90d9; color: #fff;
        cursor: pointer; transition: background-color 0.15s;
    }
    .modal-osobne .btn-pokracovat:hover { background: #357abd; }
    .modal-osobne .chyba-msg {
        color: #a94442; font-size: 12px; font-weight: bold;
        min-height: 16px; margin-top: -4px;
    }
</style>
<body>

<div class="obsah-wrap" id="obsahWrap">

    <h2 id="mesiacNadpis">Tabuľka mesiaca</h2>

    <div class="nav-tlacidla">
        <div class="nav-vnutor">
            <button id="btnPredchadzajuci">◄ Predchádzajúci</button>
            <span class="aktualny-mesiac" id="aktualnyMesiac"></span>
            <button id="btnNasledujuci">Nasledujúci ►</button>
        </div>
    </div>

    <div id="infoDnes" class="info-dnes">
        <div class="info-vnutor"></div>
    </div>

    <table id="tabulkaMesiaca">
        <thead><tr id="hlavicka"></tr></thead>
        <tbody id="telo"></tbody>
    </table>

    <table id="tabulkaNova">
        <thead><tr id="hlavickaNova"></tr></thead>
        <tbody id="teloNova"></tbody>
    </table>

    <div class="btn-pridat-wrap">
        <div class="btn-pridat-vnutor">
            <button type="button" class="btn-pridat" id="btnPridatClena" title="Pridať nového člena">+</button>
        </div>
    </div>

</div>

<div id="loadingOverlay" class="loading-overlay skryte">
    <div class="loading-text">Načítavam…</div>
</div>

<div id="modalVyber" class="modal-overlay skryte">
    <div class="modal-box" role="dialog" aria-modal="true">
        <div class="modal-title" id="modalNadpis">Vyber znak</div>
        <div class="modal-subtitle" id="modalPodnadpis"></div>
        <div class="modal-options" id="modalMoznosti"></div>
        <div class="modal-footer">
            <button type="button" class="btn-zrusit" id="modalZrusit">Zrušiť</button>
        </div>
    </div>
</div>

<div id="modalPridat" class="modal-overlay skryte">
    <div class="modal-box" role="dialog" aria-modal="true">
        <div class="modal-title">Pridať nového člena</div>

        <form class="modal-forma" id="formPridat" autocomplete="off">
            <label>Meno <input type="text" id="inputMeno" required maxlength="50"></label>
            <label>Priezvisko <input type="text" id="inputPriezvisko" required maxlength="50"></label>
            <label>Osobné číslo <input type="text" id="inputOsobneCislo" maxlength="30" inputmode="numeric" pattern="[0-9]*"></label>
            <div class="chyba-msg" id="chybaPridat"></div>
            <button type="submit" class="btn-ulozit" id="btnUlozitClena">Uložiť</button>
        </form>

        <div class="modal-footer">
            <button type="button" class="btn-zrusit" id="modalPridatZrusit">Zrušiť</button>
        </div>
    </div>
</div>

<div id="modalOsobneCislo" class="modal-overlay skryte">
    <div class="modal-box" role="dialog" aria-modal="true">
        <div class="modal-title">Zadať osobné číslo</div>
        <div class="modal-subtitle" id="modalOsobnePodnadpis"></div>

        <form class="modal-osobne" id="formOsobneCislo" autocomplete="off">
            <label>Osobné číslo
                <input type="text" id="inputOsobneCisloOverenie" required
                       inputmode="numeric" pattern="[0-9]*" maxlength="30"
                       placeholder="Zadaj osobné číslo">
            </label>
            <div class="chyba-msg" id="chybaOsobneCislo"></div>
            <button type="submit" class="btn-pokracovat" id="btnPokracovatOsobne">Pokračovať</button>
        </form>

        <div class="modal-footer">
            <button type="button" class="btn-zrusit" id="modalOsobneZrusit">Zrušiť</button>
        </div>
    </div>
</div>

<script>
    // ===== KONFIGURÁCIA =====
    const API_URL = "https://script.google.com/macros/s/AKfycbzeWKQsJprVdzlwCukuIICMpvqEOENOQEvtMkw9C-Mr6kTB4z9B9GX0olDnEF2T_JEM0A/exec";

    const TURNUS = "IO---I/-";
    const DLZKA_CYKLU = TURNUS.length;
    const KOTVA_ROK = 2026;
    const KOTVA_MESIAC = 9;
    const KOTVA_DEN = 1;
    const KOTVA_INDEX = 6;
    const ZNAKY_DEN = ["I", "/", "D", "J"];
    const DNI_BEZ_SIKMOVEJ = [0, 5, 6];

    const ZNAKY_V_MODALE = ["I", "/", "O", "D", "J", "-"];
    const ZNAKY_V_MODALE_NOVY = ["Im", "Ie", "O"];

    const JSONP_TIMEOUT_MS = 20000;
    const JSONP_MAX_POKUSOV = 3;
    const POST_OVERENIE_MS = 3000;

    const clenovia = [
        { meno: "Ján Lukáč",        posun: 0 },
        { meno: "Viktor Imrišek",   posun: 1 },
        { meno: "Vladimír Vavrík",  posun: 2 },
        { meno: "Michal Choreň",    posun: 3 },
        { meno: "Lukáš Strýček",    posun: 4 },
        { meno: "Jakub Frimm",      posun: 5 },
        { meno: "Vladimír Staník",  posun: 6 },
        { meno: "Dávid Materlin",   posun: 7 }
    ];

    let noviClenovia = [];

    const nazvyMesiaca = [
        "január","február","marec","apríl","máj","jún",
        "júl","august","september","október","november","december"
    ];
    const skratkyDni = ["Ne","Po","Ut","St","Št","Pi","So"];

    const dnes = new Date();
    let zobrazenyRok = dnes.getFullYear();
    let zobrazenyMesiac = dnes.getMonth();

    let zmenyDatabaza = [];

    let nacitavaSa = false;
    let cakajuciRefresh = false;
    let pocitadloPoziadaviek = 0;

    // ===== POMOCNÉ =====
    function dniMedzi(rok1, mes1, den1, rok2, mes2, den2) {
        const d1 = Date.UTC(rok1, mes1, den1);
        const d2 = Date.UTC(rok2, mes2, den2);
        return Math.round((d2 - d1) / 86400000);
    }

    function datumString(rok, mesiac, den) {
        return rok + "-" + String(mesiac + 1).padStart(2, "0") + "-" + String(den).padStart(2, "0");
    }

    function normalizujDatum(hodnota) {
        if (hodnota == null || hodnota === "") return "";
        const s = String(hodnota).trim();
        let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return `${m[1]}-${m[2]}-${m[3]}`;
        m = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
        const datum = new Date(s);
        if (!isNaN(datum.getTime())) {
            return [datum.getFullYear(),
                String(datum.getMonth() + 1).padStart(2, "0"),
                String(datum.getDate()).padStart(2, "0")].join("-");
        }
        return s;
    }

    function normalizujMeno(meno) {
        return String(meno == null ? "" : meno)
            .trim()
            .replace(/\s+/g, " ")
            .toLowerCase();
    }

    function zobrazZnak(znak) {
        if (znak === "Im") return "I<sub>m</sub>";
        if (znak === "Ie") return "I<sub>e</sub>";
        return znak;
    }

    function najdiManualnuZmenu(meno, rok, mesiac, den) {
        const datumStr = datumString(rok, mesiac, den);
        const hladaneMeno = normalizujMeno(meno);
        return [...zmenyDatabaza].reverse().find(z => {
            if (normalizujMeno(z.meno) !== hladaneMeno) return false;
            if (z.datum) return z.datum === datumStr;
            return Number(z.den) === Number(den);
        });
    }

    function znakPreDen(clen, rok, mesiac, den) {
        const delta = dniMedzi(KOTVA_ROK, KOTVA_MESIAC, KOTVA_DEN, rok, mesiac, den);
        let idx = (KOTVA_INDEX - clen.posun + delta) % DLZKA_CYKLU;
        idx = ((idx % DLZKA_CYKLU) + DLZKA_CYKLU) % DLZKA_CYKLU;
        return TURNUS[idx];
    }

    function efektivnyZnak(clen, rok, mesiac, den) {
        const zmena = najdiManualnuZmenu(clen.meno, rok, mesiac, den);
        if (zmena) return zmena.novyZnak;
        return znakPreDen(clen, rok, mesiac, den);
    }

    // Pre nových členov – žiadny turnus, len manuálne zmeny
    function efektivnyZnakNovy(clen, rok, mesiac, den) {
        const zmena = najdiManualnuZmenu(clen.meno, rok, mesiac, den);
        return zmena ? zmena.novyZnak : "";
    }

    function jeDnes(rok, mesiac, den) {
        return rok === dnes.getFullYear()
            && mesiac === dnes.getMonth()
            && den === dnes.getDate();
    }

    function jeAktualnyMesiac() {
        return zobrazenyRok === dnes.getFullYear() && zobrazenyMesiac === dnes.getMonth();
    }

    function aktualizujTlacidloPredchadzajuci() {
        const btn = document.getElementById("btnPredchadzajuci");
        if (jeAktualnyMesiac()) btn.classList.add("skryte");
        else btn.classList.remove("skryte");
    }

    function jeDenAktivny(clen, rok, mesiac, den) {
        const znak = efektivnyZnak(clen, rok, mesiac, den);
        if (znak === "I") return true;
        if (znak === "/") {
            const denTyzna = new Date(rok, mesiac, den).getDay();
            return !DNI_BEZ_SIKMOVEJ.includes(denTyzna);
        }
        return false;
    }

    function nastavDnesZvyraznenie(td, startDen, endDen) {
        if (!(dnes.getFullYear() === zobrazenyRok && dnes.getMonth() === zobrazenyMesiac)) return;
        const dnesDen = dnes.getDate();
        if (dnesDen < startDen || dnesDen > endDen) return;

        const pocet = endDen - startDen + 1;
        const indexDna = dnesDen - startDen;
        const zaciatok = (indexDna / pocet) * 100;
        const koniec = ((indexDna + 1) / pocet) * 100;

        if (pocet === 1) {
            td.style.backgroundImage = "none";
            td.style.backgroundColor = "#fff3b0";
            return;
        }
        td.style.backgroundImage =
            "linear-gradient(to right, " +
            "#ffffff 0%, #ffffff " + zaciatok + "%, " +
            "#fff3b0 " + zaciatok + "%, #fff3b0 " + koniec + "%, " +
            "#ffffff " + koniec + "%, #ffffff 100%)";
        td.style.backgroundColor = "transparent";
    }

    // ===== LOADING =====

            for (const key in polia) {

                input.value = polia[key];
                form.appendChild(input);

            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);

            setTimeout(resolve, POST_OVERENIE_MS);
        });
    }

    // ===== NAČÍTANIE ZO SHEETS =====
    function jsonp(url, pokus = 1) {
        return new Promise((resolve, reject) => {
            const callbackName = "jsonpCb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
            const script = document.createElement("script");
            let hotovo = false;

            const dokonci = (uspech, data) => {
                if (hotovo) return;
                hotovo = true;
                clearTimeout(timeout);
                try { delete window[callbackName]; } catch (e) {}
                try { script.remove(); } catch (e) {}
                if (uspech) resolve(data);
                else if (pokus < JSONP_MAX_POKUSOV) {
                    setTimeout(() => {
                        jsonp(url, pokus + 1).then(resolve).catch(reject);
                    }, 500 * pokus);
                } else {
                    reject(new Error("JSONP zlyhalo po " + JSONP_MAX_POKUSOV + " pokusoch."));
                }
            };

            const timeout = setTimeout(() => dokonci(false), JSONP_TIMEOUT_MS);

            window[callbackName] = function(data) {
                dokonci(true, data);
            };

            script.onerror = function() { dokonci(false); };

            script.src = url
                + (url.indexOf("?") >= 0 ? "&" : "?")
                + "callback=" + callbackName
                + "&_=" + Date.now()
                + "&r=" + Math.random().toString(36).slice(2);
            document.body.appendChild(script);
        });
    }

    function nacitajZmenyZoSheets() {
        return jsonp(API_URL).then(data => {
            if (data && !Array.isArray(data) && data.result === "error") {
                zmenyDatabaza = [];
                return;
            }
            if (Array.isArray(data)) {
                zmenyDatabaza = data.map(z => {
                    let datum, meno, den, novyZnak;
                    if (Array.isArray(z)) {
                        datum = z[0]; meno = z[1]; den = z[2]; novyZnak = z[3];
                    } else {
                        datum = z.datum; meno = z.meno; den = z.den; novyZnak = z.novyZnak;
                    }
                    return {
                        datum: normalizujDatum(datum),
                        meno: String(meno || "").trim(),
                        den: den,
                        novyZnak: (novyZnak == null ? "" : String(novyZnak))
                    };
                });
            } else {
                zmenyDatabaza = [];
            }
        });
    }

    function nacitajNovychClenovZoSheets() {
        return jsonp(API_URL + "?typ=clenovia").then(data => {
            if (data && !Array.isArray(data) && data.result === "error") {
                noviClenovia = [];
                return;
            }
            if (Array.isArray(data)) {
                noviClenovia = data.map(c => ({
                    meno: String(c.meno || "").trim(),
                    osobneCislo: String(c.osobneCislo || "").trim()
                })).filter(c => c.meno);
            } else {
                noviClenovia = [];
            }
        });
    }

    // ===== SPOLOČNÉ VYKRESLENIE RIADKU (turnus alebo nový člen) =====
    function vykresliRiadok(telo, clen, startDen, pocetDni, getZnak, menoClass, jeNovy = false) {
        const tr = document.createElement("tr");

        const tdMeno = document.createElement("td");
        tdMeno.className = menoClass || "name-col";
        tdMeno.textContent = clen.meno;
        if (menoClass === "name-col") {
            const dnesVZobrazenom =
                dnes.getFullYear() === zobrazenyRok && dnes.getMonth() === zobrazenyMesiac;
            if (dnesVZobrazenom && jeDenAktivny(clen, zobrazenyRok, zobrazenyMesiac, dnes.getDate())) {
                tdMeno.classList.add("name-col-aktivny");
            }
        }
        tr.appendChild(tdMeno);

        let d = startDen;

        // Ↄ pre deň 1 (noc z minulého mesiaca)
        if (d === 1) {
            const predchDatum = new Date(zobrazenyRok, zobrazenyMesiac, 0);
            const poslednyDenMinuleho = getZnak(
                clen, predchDatum.getFullYear(),
                predchDatum.getMonth(), predchDatum.getDate()
            );
            if (poslednyDenMinuleho === "O") {
                const td = document.createElement("td");
                td.textContent = "Ↄ";
                td.classList.add("turnus-C-rev");
                td.title = "Deň 1: noc pokračuje z minulého mesiaca";
                if (jeDnes(zobrazenyRok, zobrazenyMesiac, 1)) td.classList.add("dnes-stlpec");
                pridelKlikHandler(td, clen, 1, "Ↄ", jeNovy);
                tr.appendChild(td);
                d = 2;
            }
        }

        while (d <= pocetDni) {
            const znak = getZnak(clen, zobrazenyRok, zobrazenyMesiac, d);
            const datum = new Date(zobrazenyRok, zobrazenyMesiac, d);
            const denTyzna = datum.getDay();
            const td = document.createElement("td");

            if (d === pocetDni && znak === "O") {
                td.textContent = "C";
                td.classList.add("turnus-C");
                td.title = "Noc začína na konci mesiaca";
                if (jeDnes(zobrazenyRok, zobrazenyMesiac, d)) td.classList.add("dnes-stlpec");
                pridelKlikHandler(td, clen, d, "C", jeNovy);
                tr.appendChild(td);
                d += 1;
                continue;
            }

            if (znak === "O") {
                const dalsiDen = d + 1;
                const dalsiZnak = (dalsiDen <= pocetDni)
                    ? getZnak(clen, zobrazenyRok, zobrazenyMesiac, dalsiDen)
                    : null;
                if (dalsiZnak === "O" && d + 2 <= pocetDni) {
                    td.colSpan = 3;
                    td.classList.add("turnus-OO");
                    td.textContent = "";
                    td.title = "Dve nočné po sebe (deň " + d + " → deň " + (d + 2) + ")";
                    nastavDnesZvyraznenie(td, d, d + 2);
                    pridelKlikHandlerPreOO(td, clen, d, d + 1, d + 2, jeNovy);
                    tr.appendChild(td);
                    d += 3;
                    continue;
                }
                td.colSpan = 2;
                td.classList.add("turnus-O-single");
                td.textContent = "";
                td.title = "Noc (deň " + d + " → deň " + dalsiDen + ")";
                nastavDnesZvyraznenie(td, d, dalsiDen);
                pridelKlikHandlerPreSingle(td, clen, d, d + 1, jeNovy);
                tr.appendChild(td);
                d += 2;
                continue;
            }

            if (znak === "-" || znak === "" || znak == null) {
                td.textContent = "";
                if (jeDnes(zobrazenyRok, zobrazenyMesiac, d)) td.classList.add("dnes-stlpec");
                pridelKlikHandler(td, clen, d, znak || "", jeNovy);
                tr.appendChild(td);
                d += 1;
                continue;
            }

            if (znak === "/" && DNI_BEZ_SIKMOVEJ.includes(denTyzna)) {
                td.textContent = "";
                if (jeDnes(zobrazenyRok, zobrazenyMesiac, d)) td.classList.add("dnes-stlpec");
                pridelKlikHandler(td, clen, d, "", jeNovy);
                tr.appendChild(td);
                d += 1;
                continue;
            }

            td.innerHTML = zobrazZnak(znak);
            if (ZNAKY_DEN.includes(znak) || znak === "Im" || znak === "Ie") td.classList.add("turnus-den");
            if (jeDnes(zobrazenyRok, zobrazenyMesiac, d)) td.classList.add("dnes-stlpec");
            pridelKlikHandler(td, clen, d, znak, jeNovy);
            tr.appendChild(td);
            d += 1;
        }
        telo.appendChild(tr);
    }

    function zapisZmenu(clen, den, znak) {
        const datumStr = datumString(zobrazenyRok, zobrazenyMesiac, den);
        zmenyDatabaza = zmenyDatabaza.filter(
            z => !(z.datum === datumStr && z.meno === clen.meno)
        );
        zmenyDatabaza.push({
            datum: datumStr, meno: clen.meno, den: den, novyZnak: znak
        });
        ulozZmenuDoSheets(datumStr, clen.meno, den, znak);
        vykresliTabulku();
        vykresliNovuTabulku();
    }

    // ===== KLIK HANDLERY =====
    function pridelKlikHandler(td, clen, den, aktualnyZnak, jeNovy = false) {
        td.style.cursor = "pointer";
        td.title = "Klikni pre zmenu. Aktuálne: '" + (aktualnyZnak || "prázdne") + "'";

    function obnovAVykresli(silent = false) {
        if (nacitavaSa) {
            cakajuciRefresh = true;
            return Promise.resolve();
        }
        nacitavaSa = true;
        cakajuciRefresh = false;
        if (!silent) zobrazLoading(true);

        const mojeCislo = ++pocitadloPoziadaviek;

        return nacitajZmenyZoSheets()
            .then(() => new Promise(r => setTimeout(r, 300)))
            .then(() => nacitajNovychClenovZoSheets())
            .then(() => {
                if (mojeCislo !== pocitadloPoziadaviek) return;
                vykresliTabulku();
                vykresliNovuTabulku();
            })
            .catch((err) => {
                if (mojeCislo === pocitadloPoziadaviek) {
                    vykresliTabulku();
                    vykresliNovuTabulku();
                }
            })
            .finally(() => {
                nacitavaSa = false;
                if (!silent) zobrazLoading(false);
                if (cakajuciRefresh) {
                    cakajuciRefresh = false;
                    obnovAVykresli(silent);
                }
            });
    }

    document.getElementById("btnPredchadzajuci").addEventListener("click", () => {
        zobrazenyMesiac--;
        if (zobrazenyMesiac < 0) { zobrazenyMesiac = 11; zobrazenyRok--; }
        obnovAVykresli();
    });
    document.getElementById("btnNasledujuci").addEventListener("click", () => {
        zobrazenyMesiac++;
        if (zobrazenyMesiac > 11) { zobrazenyMesiac = 0; zobrazenyRok++; }
        obnovAVykresli();
    });

    document.addEventListener("DOMContentLoaded", () => {
        obnovAVykresli();
    });
